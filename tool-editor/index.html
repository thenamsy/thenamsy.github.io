<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprocket Rocket Tool Editor</title>
</head>
<body>
    <h1>Sprocket Rocket Tool Editor</h1>

    <form action="">

        <p>Point coordinates, relative to the tool center (orange dot)</p>
        <div id="point-coordinates">
            <div>
                <label for="point-1">Point 1:</label>
                <input type="text" name="point-1" id="">
            </div>
            <div>
                <label for="point-2">Point 2:</label>
                <input type="text" name="point-2" id="">
            </div>
            <div>
                <label for="point-3">Point 3:</label>
                <input type="text" name="point-3" id="">
            </div>
        </div>
        <button>New point</button>
    </form>
</body>
</html>
