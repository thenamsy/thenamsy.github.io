<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprocket Rocket Tool Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="generate.js" defer></script>
    <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
</head>
<body>
    <h1>Sprocket Rocket Tool Editor</h1>

    <h2>Info:</h2>
    <ul>
        <li>All numbers must be between -138 and 117.</li>
        <li>The X coordinate increases going right, and decreases going left.</li>
        <li>The Y coordinate increases going down, and decreases going up.</li>
    </ul>

    <form action="">
        
        <fieldset id="point-coordinates">
            <legend>Point coordinates</legend>

            <button type="button" id="add-point-button">Add point</button>
            <button type="button" id="remove-last-point-button">Remove last point</button>

            <div id="coordinate-inputs">
            </div>

            <input type="checkbox" id="join-up" checked>
            <label for="join-up">Join first and last points</label><br>

        </fieldset>

        <fieldset id="tool-type-div">
            <legend>Tool type</legend>
            <ul>
                <li>
                    <input type="radio" name="tool-type" id="glued-button" required>
                    <label for="glued-button">Glued</label>
                </li>

                <li>
                    <input type="radio" name="tool-type" id="swing-button">
                    <label for="swing-button">Swing</label>
                </li>

                <li>
                    <input type="radio" name="tool-type" id="spin-button">
                    <label for="spin-button">Spin</label>
                </li>
                <li>
                    <input type="radio" name="tool-type" id="torque-button">
                    <label for="torque-button">Torque</label>
                </li>
            </ul>
        </fieldset>

        <div>
            <button id="generate-button" type="button">Generate tool!</button>
        </div>

    </form>

    <div id="output">
        <output id="output-text"></output><br>
        <button id="copy-button">Copy</button>
    </div>
</body>
</html>
