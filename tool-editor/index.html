<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprocket Rocket Tool Editor</title>
</head>
<body>
    <h1>Sprocket Rocket Tool Editor</h1>

    <form action="">

        <p>Point coordinates, relative to the tool center (orange dot)</p>
        <div id="point-coordinates">
            <div id="point-1-coordinates">
                <label>Point 1: </label>
                <span>
                    <label for="point-1-x">x:</label>
                    <input type="number" name="point-1-x" id="" max="117" min="-138">
                    <label for="point-1-y">y:</label>
                    <input type="number" name="point-1-y" id="" max="117" min="-138">
                </span>
            </div>
            <div id="point-2-coordinates">
                <label>Point 2: </label>
                <span>
                    <label for="point-2-x">x:</label>
                    <input type="number" name="point-2-x" id="" max="117" min="-138">
                    <label for="point-2-y">y:</label>
                    <input type="number" name="point-2-y" id="" max="117" min="-138">
                </span>
            </div>
            <div id="point-3-coordinates">
                <label>Point 3: </label>
                <span>
                    <label for="point-3-x">x:</label>
                    <input type="number" name="point-3-x" id="" max="117" min="-138">
                    <label for="point-3-y">y:</label>
                    <input type="number" name="point-3-y" id="" max="117" min="-138">
                </span>
            </div>

        </div>
        <button>New point</button>

        <div>
            <button id="generate-button">Generate tool!</button>
        </div>
    </form>
</body>
</html>
