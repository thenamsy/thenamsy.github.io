<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprocket Rocket Tool Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="generate.js" defer></script>
</head>
<body>
    <h1>Sprocket Rocket Tool Editor</h1>

    <form action="">
        
        <fieldset id="point-coordinates">
            <legend>Point coordinates</legend>
            
            <div id="point-1-coordinates">
                <label>Point 1: </label>
                <span>
                    <label for="point-1-x">x:</label>
                    <input type="number" name="point-1-x" max="117" min="-138" class="coordinate-input">
                    <label for="point-1-y">y:</label>
                    <input type="number" name="point-1-y" max="117" min="-138" class="coordinate-input">
                </span>
            </div>
            <div id="point-2-coordinates">
                <label>Point 2: </label>
                <span>
                    <label for="point-2-x">x:</label>
                    <input type="number" name="point-2-x" max="117" min="-138" class="coordinate-input">
                    <label for="point-2-y">y:</label>
                    <input type="number" name="point-2-y" max="117" min="-138" class="coordinate-input">
                </span>
            </div>
            <div id="point-3-coordinates">
                <label>Point 3: </label>
                <span>
                    <label for="point-3-x">x:</label>
                    <input type="number" name="point-3-x" max="117" min="-138" class="coordinate-input">
                    <label for="point-3-y">y:</label>
                    <input type="number" name="point-3-y" max="117" min="-138" class="coordinate-input">
                </span>
            </div>

            <button type="button" id="add-point-button">Add point</button>

        </fieldset>

        <fieldset id="tool-type-div">
            <legend>Tool type:</legend>
            <ul>
                <li>
                    <input type="radio" name="tool-type" id="glued-button" required>
                    <label for="glued-button">Glued</label>
                </li>

                <li>
                    <input type="radio" name="tool-type" id="swing-button">
                    <label for="swing-button">Swing</label>
                </li>

                <li>
                    <input type="radio" name="tool-type" id="spin-button">
                    <label for="spin-button">Spin</label>
                </li>
                <li>
                    <input type="radio" name="tool-type" id="torque-button">
                    <label for="torque-button">Torque</label>
                </li>
            </ul>
        </fieldset>

        <div>
            <button id="generate-button" type="button">Generate tool!</button>
        </div>

    </form>
</body>
</html>
